<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Sport Facility</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <h2>Admin Dashboard</h2>

    <!-- Admin-only content -->
    <div id="adminContent">
      <button id="addFacilityBtn">Add Facility</button>
      <button id="viewLogsBtn">View Logs</button>
      <div id="logsContainer"></div>
    </div>

    <!-- Optional: fallback message -->
    <div id="accessDenied" style="display:none;">
      <p>Access denied: You do not have permission to view this page.</p>
    </div>
  </div>

  <script type="module" src="assets/js/navbar.js"></script>
  <script type="module">
    import { db } from "./firebaseConfig.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { requireRole } from "./auth.js";

    // Enforce RBAC: only admin can access
    requireRole(["admin"]).then(async user => {
      console.log("Admin authorized:", user.email);

      // Load logs from Firestore
      const logsSnap = await getDocs(collection(db, "logs"));
      const container = document.getElementById("logsContainer");
      logsSnap.forEach(doc => {
        const data = doc.data();
        const div = document.createElement("div");
        const timestamp = data.timestamp?.toDate() || new Date();
        div.textContent = `[${timestamp.toLocaleString()}] UID: ${data.uid} Action: ${data.action}`;
        container.appendChild(div);
      });

    }).catch(err => {
      console.error("Access denied or error:", err);

      // Hide admin content and show access denied
      document.getElementById("adminContent").style.display = "none";
      document.getElementById("accessDenied").style.display = "block";
    });
  </script>
</body>
</html>
