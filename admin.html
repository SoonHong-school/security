<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Facilities</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <style>
    /* Add some general styling for the admin panel */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    /* Sidebar styles */
    .sidebar {
      height: 100%;
      width: 250px;
      background-color: #2c3e50;
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 20px;
    }

    .sidebar a {
      padding: 15px 20px;
      text-decoration: none;
      font-size: 18px;
      color: white;
      display: block;
      transition: background-color 0.3s;
    }

    .sidebar a:hover {
      background-color: #34495e;
    }

    .main-content {
      margin-left: 260px;
      padding: 20px;
    }

    /* Header styles */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #34495e;
      padding: 15px 30px;
      color: white;
    }

    .header h1 {
      margin: 0;
    }

    .logout-btn {
      background-color: #e74c3c;
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }

    /* Card layout for facilities */
    .card {
      background-color: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      margin-top: 0;
    }

    /* Input form styling */
    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 5px;
    }

    .button {
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .button:hover {
      background-color: #2980b9;
    }

    .facilityItem {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding: 10px;
      background-color: #ecf0f1;
      border-radius: 4px;
    }

    .facilityItem p {
      margin: 0;
    }

    .deleteBtn {
      background-color: #e74c3c;
      border: none;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .deleteBtn:hover {
      background-color: #c0392b;
    }

  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Dashboard</h2>
    <a href="#">Dashboard</a>
    <a href="#">Manage Facilities</a>
    <a href="#">Manage Bookings</a>
    <a href="#">Manage Users</a>
    <a href="#">Settings</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <div class="header">
      <h1>Admin Panel - Manage Sport Facilities</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Access Denied -->
    <div id="accessDenied" style="display:none;">
      <p>You do not have permission to access this page.</p>
    </div>

    <!-- Admin Content -->
    <div id="adminContent" style="display:none;">

      <!-- Add Facility Form -->
      <div class="card">
        <h3>Add New Facility</h3>
        <form id="facilityForm">
          <div class="input-group">
            <label for="facilityName">Facility Name</label>
            <input type="text" id="facilityName" placeholder="Facility Name" required>
          </div>
          <div class="input-group">
            <label for="facilityLocation">Location</label>
            <input type="text" id="facilityLocation" placeholder="Location" required>
          </div>
          <button type="submit" class="button">Add Facility</button>
        </form>
      </div>

      <hr>

      <!-- Facility List -->
      <div class="card">
        <h3>Existing Facilities</h3>
        <div id="facilityList"></div>
      </div>

    </div>
  </div>

  <!-- Navbar script -->
  <script type="module" src="assets/js/navbar.js"></script>

  <!-- Admin logic -->
  <script type="module">
    import { db } from "/assets/js/firebaseConfig.js";
    import { requireRole } from "/assets/js/auth.js";
    import {
      collection,
      getDocs,
      addDoc,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Only admin can access this page
    requireRole(["admin"]).then(async admin => {
      console.log("Admin logged in:", admin.email);
      document.getElementById("adminContent").style.display = "block";

      const facilityList = document.getElementById("facilityList");

      // Load facility list
      async function loadFacilities() {
        facilityList.innerHTML = "";
        const snap = await getDocs(collection(db, "facilities"));
        snap.forEach(docSnap => {
          const data = docSnap.data();

          const div = document.createElement("div");
          div.classList.add("facilityItem");

          div.innerHTML = `
            <p><strong>${data.name}</strong> - ${data.location}</p>
            <button class="deleteBtn" data-id="${docSnap.id}">Delete</button>
          `;

          facilityList.appendChild(div);
        });

        // Attach delete events
        document.querySelectorAll(".deleteBtn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-id");
            await deleteDoc(doc(db, "facilities", id));
            loadFacilities(); // reload
          });
        });
      }

      loadFacilities();

      // Handle Add Facility
      const form = document.getElementById("facilityForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("facilityName").value;
        const location = document.getElementById("facilityLocation").value;

        await addDoc(collection(db, "facilities"), { name, location });

        form.reset();
        loadFacilities();
      });

    }).catch(err => {
      console.error(err);
      document.getElementById("accessDenied").style.display = "block";
    });

    function logout() {
      // Implement logout functionality here
      window.location.href = "login.html";
    }
  </script>

</body>

</html>
