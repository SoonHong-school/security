<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Sport Facility Booking</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/navbar.css" />
</head>

<body>

  <!-- Navbar placeholder -->
  <div id="navbar"></div>

  <div class="container">
    <h2>Create Account</h2>

    <!-- Email input -->
    <div class="input-container">
      <input type="email" id="registerEmail" placeholder="Email" required />
    </div>

    <!-- Password input -->
    <div class="password-container">
      <input type="password" id="registerPassword" placeholder="Password" required />
      <span class="toggle-password" data-target="registerPassword">👁️</span>
    </div>

    <!-- Confirm password input -->
    <div class="password-container">
      <input type="password" id="registerConfirm" placeholder="Confirm Password" required />
      <span class="toggle-password" data-target="registerConfirm">👁️</span>
    </div>

    <!-- Password requirements -->
    <p id="passwordRequirements">
      Password must be at least 8 characters and include: <br>
      • Uppercase letters <br>
      • Lowercase letters <br>
      • Numbers <br>
      • Special characters (e.g., @ $ ! % * ? &amp; #)
    </p>

    <button id="registerBtn">Register</button>

    <!-- Email verification notice -->
    <p id="verificationNotice" style="display:none; color: green;">
      Registration successful! A verification email has been sent. Please check your inbox.
    </p>

    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <!-- Load Navbar -->
  <script type="module" src="assets/js/navbar.js"></script>

  <!-- Load Auth script (handles registration + Firestore creation) -->
  <script type="module" src="assets/js/auth.js"></script>

</body>
</html>
