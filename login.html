<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sport Facility Booking</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/navbar.css" />
  <style>
    .toggle-password {
      cursor: pointer;
      font-size: 1.2rem;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
  <div id="navbar"></div>

  <div class="container">
    <h2>Login</h2>

    <div class="input-container">
      <input type="email" id="loginEmail" placeholder="Email" required />
    </div>

    <div class="password-container">
      <input type="password" id="loginPassword" placeholder="Password" required />
      <span class="toggle-password" data-target="loginPassword">&#128065;</span>
    </div>

    <button id="loginBtn">Login</button>

    <p id="loginError" style="color: red; display: none;"></p>

    <p id="verificationNotice" style="display:none; color: orange;">
      Your email is not verified yet. Please check your inbox and verify your email to login.
    </p>

    <p>Don’t have an account? <a href="register.html">Register here</a></p>
  </div>

  <script type="module" src="assets/js/navbar.js"></script>

  <!-- Import auth.js to handle login logic -->
  <script type="module" src="assets/js/auth.js"></script>

</body>

</html>
