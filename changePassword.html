<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | Sport Facility Booking</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/navbar.css" />
</head>
<body>
  <!-- Navbar placeholder -->
  <div id="navbar"></div>

  <div class="container">
    <h2>Change Password</h2>
    <p>Enter your current password and new password to update.</p>

    <form id="changePasswordForm">
      <label for="oldPassword">Current Password:</label>
      <input type="password" id="oldPassword" required />

      <label for="newPassword">New Password:</label>
      <input type="password" id="newPassword" required />

      <label for="confirmPassword">Confirm New Password:</label>
      <input type="password" id="confirmPassword" required />

      <button type="submit">Update Password</button>
    </form>

    <p id="message" style="color: red; margin-top: 10px;"></p>
    <p><a href="profile.html">← Back to Profile</a></p>
  </div>

  <script type="module">
    import { auth } from "/assets/js/firebaseConfig.js";
    import { EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const form = document.getElementById("changePasswordForm");
    const oldPasswordInput = document.getElementById("oldPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";

      const oldPassword = oldPasswordInput.value;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword !== confirmPassword) {
        message.textContent = "New passwords do not match.";
        return;
      }

      const user = auth.currentUser;
      if (!user) {
        message.textContent = "No user logged in. Please log in again.";
        return;
      }

      try {
        // Reauthenticate the user with old password
        const credential = EmailAuthProvider.credential(user.email, oldPassword);
        await reauthenticateWithCredential(user, credential);

        // Update password
        await updatePassword(user, newPassword);
        message.style.color = "green";
        message.textContent = "Password updated successfully!";
        form.reset();

        setTimeout(() => {
  auth.signOut(); // sign out the user
  window.location.href = "login.html";
}, 1500);

      } catch (err) {
        console.error(err);
        message.style.color = "red";
        if (err.code === "auth/wrong-password") {
          message.textContent = "Current password is incorrect.";
        } else if (err.code === "auth/weak-password") {
          message.textContent = "New password is too weak. Use at least 6 characters.";
        } else {
          message.textContent = "Error updating password. Please try again.";
        }
      }
    });
  </script>
  <script type="module" src="assets/js/navbar.js"></script>
</body>
</html>
